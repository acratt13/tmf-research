[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmf-research"
version = "0.1.0"
description = "Evidence and report foundation for a research workbench with REA software inspection"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "TMF Systems"}]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
pdf = ["reportlab>=4"]

[project.scripts]
tmf-research = "tmf_research.cli:main"

[tool.setuptools.packages.find]
include = ["tmf_research*"]
